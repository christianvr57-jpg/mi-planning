# Envía cada mañana (7:00, hora de Madrid en invierno) una notificación con el entreno del día
name: Aviso diario
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i --no-save --no-package-lock web-push@3.6.7
      - run: node .github/push/daily.mjs
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTIONS: ${{ secrets.PUSH_SUBSCRIPTIONS }}
          COACH_URL: ${{ secrets.COACH_URL }}
          COACH_TOKEN: ${{ secrets.COACH_TOKEN }}
